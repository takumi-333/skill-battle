<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Battle | サーバー運用</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101722; color: #e8edf5; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header, .toolbar, .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; } h2 { font-size: 1.1rem; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 16px; margin-top: 18px; }
    section { background: #192333; border: 1px solid #30415b; border-radius: 10px; padding: 16px; }
    button, input { border: 1px solid #536983; border-radius: 6px; padding: 8px 11px; background: #111925; color: inherit; }
    button { cursor: pointer; } button:hover { background: #283953; } button.danger { border-color: #a45b5b; }
    #token { min-width: 265px; } #notice { min-height: 1.3em; color: #9fc4ff; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 14px; margin: 0; } dt { color: #aab9cf; } dd { margin: 0; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow-y: auto; margin: 0; font-size: .82rem; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; } td, th { padding: 7px; text-align: left; border-bottom: 1px solid #30415b; vertical-align: top; }
    .muted { color: #aab9cf; } .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header><h1>サーバー運用</h1><span class="muted">10秒ごとに更新</span></header>
  <div class="toolbar" style="margin-top:16px">
    <input id="token" type="password" autocomplete="off" placeholder="管理トークン">
    <button id="save-token">接続</button><button id="refresh">今すぐ更新</button>
    <span id="notice"></span>
  </div>
  <main class="grid">
    <section><h2>サービス</h2><pre id="services">管理トークンを入力してください。</pre>
      <div class="actions" style="margin-top:12px"><button data-action="start">開始</button><button data-action="restart">再起動</button><button class="danger" data-action="stop">停止</button></div>
    </section>
    <section><h2>Dedicated Server 心拍</h2><dl id="heartbeat"><dt>状態</dt><dd>心拍待ち</dd></dl></section>
    <section class="wide"><h2>Dedicated Server が受理した重要イベント</h2><table><thead><tr><th>時刻</th><th>種別</th><th>ルーム</th><th>内容</th></tr></thead><tbody id="events"><tr><td colspan="4" class="muted">イベント待ち</td></tr></tbody></table></section>
    <section class="wide"><h2>直近ログ</h2><pre id="logs">管理トークンを入力してください。</pre></section>
  </main>
  <script>
    const tokenInput = document.querySelector('#token'), notice = document.querySelector('#notice');
    const hashToken = new URLSearchParams(location.hash.slice(1)).get('token');
    if (hashToken) { sessionStorage.setItem('skill-battle-admin-token', hashToken); history.replaceState(null, '', location.pathname); }
    tokenInput.value = sessionStorage.getItem('skill-battle-admin-token') || '';
    const headers = () => ({'X-Skill-Battle-Admin-Token': tokenInput.value});
    const stamp = seconds => seconds ? new Date(seconds * 1000).toLocaleString() : '未受信';
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function request(path, options = {}) {
      const response = await fetch(path, {...options, headers: {...headers(), ...(options.headers || {})}});
      const data = await response.json().catch(() => ({detail: `HTTP ${response.status}`}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      return data;
    }
    function showHeartbeat(data) {
      const root = document.querySelector('#heartbeat'), heartbeat = data.heartbeat;
      if (!heartbeat) root.innerHTML = '<dt>状態</dt><dd>心拍待ち</dd>';
      else {
        const d = heartbeat.details;
        root.innerHTML = [
          ['最終受信', stamp(heartbeat.received_at)], ['稼働時間', `${d.uptime_seconds ?? 0} 秒`],
          ['アクティブルーム', d.active_rooms ?? 0], ['接続 peer', d.connected_peers ?? 0],
          ['受理入力（直近区間）', d.accepted_inputs ?? 0], ['受理イベント（直近区間）', d.accepted_events ?? 0],
          ['拒否イベント（直近区間）', d.rejected_events ?? 0],
        ].map(([key, value]) => `<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
      }
      document.querySelector('#events').innerHTML = data.events.length ? data.events.map(e => `<tr><td>${escapeHtml(stamp(e.created_at))}</td><td>${escapeHtml(e.kind)}</td><td>${escapeHtml(e.room_id || '-')}</td><td>${escapeHtml(JSON.stringify(e.details))}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">イベント待ち</td></tr>';
    }
    async function refresh() {
      if (!tokenInput.value) return;
      try {
        const [services, monitoring, logs] = await Promise.allSettled([request('/admin/api/services'), request('/admin/api/monitoring'), request('/admin/api/logs')]);
        document.querySelector('#services').textContent = services.status === 'fulfilled' ? (services.value.output || '取得できませんでした。') : `取得失敗: ${services.reason.message}`;
        document.querySelector('#logs').textContent = logs.status === 'fulfilled' ? (logs.value.output || 'ログはありません。') : `取得失敗: ${logs.reason.message}`;
        if (monitoring.status === 'fulfilled') showHeartbeat(monitoring.value);
        const errors = [services, monitoring, logs].filter(result => result.status === 'rejected').map(result => result.reason.message);
        notice.textContent = errors.length ? `一部の取得に失敗: ${errors.join(' / ')}` : `更新: ${new Date().toLocaleTimeString()}`;
      } catch (error) { notice.textContent = `取得失敗: ${error.message}`; }
    }
    document.querySelector('#save-token').onclick = () => { sessionStorage.setItem('skill-battle-admin-token', tokenInput.value); refresh(); };
    document.querySelector('#refresh').onclick = refresh;
    document.querySelectorAll('[data-action]').forEach(button => button.onclick = async () => {
      if (!confirm(`${button.dataset.action} を実行しますか？`)) return;
      if (button.dataset.action === 'stop' || button.dataset.action === 'restart') {
        notice.textContent = `${button.dataset.action} を開始しました。再起動は数秒後に更新してください。`;
        request('/admin/api/services', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action: button.dataset.action})}).catch(() => {});
        return;
      }
      try { await request('/admin/api/services', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action: button.dataset.action})}); await refresh(); }
      catch (error) { notice.textContent = `操作失敗: ${error.message}`; }
    });
    if (tokenInput.value) refresh(); setInterval(refresh, 10000);
  </script>
</body>
</html>
