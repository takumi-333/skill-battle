name: 開発依頼
description: Codexに実装を依頼するためのIssue
title: "[開発] "
labels:
  - draft
  - priority:normal
body:
  - type: markdown
    attributes:
      value: |
        実装を開始してよい状態になったら、内容を確認してから `ready-for-agent` ラベルを付けてください。
  - type: textarea
    id: background
    attributes:
      label: 目的・背景
      description: なぜ必要か、解決したい課題を書いてください。
      placeholder: 例: 対戦画面でキャラクターの向きが分かりにくいため…
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受入条件
      description: 完了を確認できる条件をチェックリストで書いてください。
      placeholder: |
        - [ ] 対戦画面で…
        - [ ] Godotを起動して…
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 変更範囲
      description: 変更してよい画面・機能・ファイルの範囲を書いてください。
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 変更しないこと
      description: 守る既存挙動、今回対象外のことを書いてください。なければ「なし」と書いてください。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: テスト、Godotでの操作、確認したい画面を書いてください。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 関連資料
      description: 仕様書、関連Issue、画像、参考リンクを書いてください。なければ「なし」と書いてください。
    validations:
      required: true
