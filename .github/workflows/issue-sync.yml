name: Issueを実装用コピーへ同期

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    concurrency:
      group: issue-sync-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: デフォルトブランチを取得
        id: repository
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('default_branch', context.payload.repository.default_branch);

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.repository.outputs.default_branch }}

      - name: Issue本文を実装用コピーへ書き出す
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const filePath = `docs/issues/issue-${issue.number}.md`;
            const content = [
              `# Issue #${issue.number}: ${issue.title}`,
              '',
              `- GitHub Issue: ${issue.html_url}`,
              `- 同期日時: ${new Date().toISOString()}`,
              '',
              '---',
              '',
              issue.body || ''
            ].join('\n');
            fs.mkdirSync('docs/issues', { recursive: true });
            fs.writeFileSync(filePath, content, 'utf8');

      - name: 同期PRを作成または更新
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/issue-${{ github.event.issue.number }}-sync
          delete-branch: true
          title: "chore: Issue #${{ github.event.issue.number }} を実装用コピーへ同期"
          commit-message: "chore: Issue #${{ github.event.issue.number }} を同期"
          body: |
            Ref #${{ github.event.issue.number }}

            GitHub Issue本文を `docs/issues/issue-${{ github.event.issue.number }}.md` に同期しました。
            このPRはIssueの実装許可ではなく、Steeringの依頼元を用意するための同期です。

      - name: Issueへ同期結果を通知
        if: steps.create-pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `実装用コピーを同期しました: ${{ steps.create-pr.outputs.pull-request-url }}`
            });
