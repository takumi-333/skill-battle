<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>スプライトエディタ</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#181a1f;color:#eef2f8}*{box-sizing:border-box}body{margin:0;min-width:760px}header{padding:14px 20px;background:#242831;border-bottom:1px solid #424a57}h1{font-size:18px;margin:0 0 4px}p{margin:0;font-size:13px;color:#c0c9d7}main{display:grid;grid-template-columns:minmax(480px,1fr) 300px;gap:14px;padding:14px}.panel{background:#242831;border:1px solid #3f4855;border-radius:8px;padding:12px}.bar,.tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:10px}button,input{font:inherit}button{padding:7px 9px;background:#343c49;color:inherit;border:1px solid #576375;border-radius:5px;cursor:pointer}button:hover,button.active{background:#3b69aa;border-color:#78a4e5}button:disabled{opacity:.45}label{display:inline-flex;gap:5px;align-items:center;font-size:13px}input[type=number]{width:58px}.canvas-wrap{min-height:540px;overflow:auto;display:grid;place-items:center;padding:16px;border:1px solid #3f4855;border-radius:6px;background:#17191d}canvas{image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 1px #718096;cursor:crosshair}aside{display:grid;align-content:start;gap:12px}h2{font-size:14px;margin:0 0 8px}.stack{display:grid;gap:8px}#cells{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:220px;overflow:auto}#cells button{font-size:11px;padding:6px 2px}.status,.warning{font-size:12px;line-height:1.45;word-break:break-all}.status{color:#c0c9d7}.warning{color:#f0c983}
</style></head><body>
<header><h1>スプライトエディタ</h1><p>選択した既存PNGを1px単位で修正し、同じファイルへ上書きします。</p></header>
<main><section class="panel"><div class="bar"><button id="open">既存PNGを開く</button><button id="save" disabled>上書き保存</button><label>表示倍率 <input id="zoom" type="number" min="1" max="24" value="8"> px/ドット</label><label><input id="grid" type="checkbox" checked> グリッド</label></div><div class="canvas-wrap"><p id="hint">「既存PNGを開く」から assets 内のファイルを選んでください。</p><canvas id="editor" hidden></canvas></div></section>
<aside><section class="panel stack"><h2>編集範囲</h2><div class="tools"><button id="sheetMode" class="active">シート全体</button><button id="cellMode">64pxセル</button></div><div id="cells"></div><div id="selection" class="status">画像を開くと64pxセルを選べます。</div></section>
<section class="panel stack"><h2>描画</h2><div class="tools"><button id="pencil" class="active">ペン</button><button id="eraser">消しゴム</button><button id="fill">塗りつぶし</button><button id="picker">スポイト</button></div><label>色 <input id="color" type="color" value="#ff00ff"></label><label>不透明度 <input id="alpha" type="number" min="0" max="255" value="255"></label><button id="transparent">透明色にする</button></section>
<section class="panel stack"><h2>履歴</h2><div class="tools"><button id="undo" disabled>元に戻す</button><button id="redo" disabled>やり直す</button></div><div class="warning">保存は元のPNGを変更します。必要なら編集前にコピーしてください。</div></section><section class="panel"><div id="status" class="status">準備完了</div></section></aside></main>
<script>
(()=>{const CELL=64,sheet=document.createElement('canvas'),src=sheet.getContext('2d',{willReadFrequently:true}),canvas=document.querySelector('#editor'),ctx=canvas.getContext('2d'),ids=['open','save','zoom','grid','sheetMode','cellMode','cells','selection','pencil','eraser','fill','picker','color','alpha','transparent','undo','redo','status','hint'],el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));let handle=null,mode='sheet',tool='pencil',cell={col:0,row:0},drawing=false,last=null,changed=false,history=[],historyIndex=-1;
const ready=()=>sheet.width>0&&sheet.height>0,cols=()=>Math.floor(sheet.width/CELL),rows=()=>Math.floor(sheet.height/CELL),scale=()=>Math.max(1,Math.min(24,Number(el.zoom.value)||8)),bounds=()=>mode==='cell'?{x:cell.col*CELL,y:cell.row*CELL,w:CELL,h:CELL}:{x:0,y:0,w:sheet.width,h:sheet.height},say=t=>el.status.textContent=t,color=()=>{const h=el.color.value;return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),Math.max(0,Math.min(255,Number(el.alpha.value)||0))]};
function setTool(x){tool=x;for(const[n,b]of Object.entries({pencil:el.pencil,eraser:el.eraser,fill:el.fill,picker:el.picker}))b.classList.toggle('active',n===tool)}function setMode(x){if(x==='cell'&&(!cols()||!rows()))return;mode=x;el.sheetMode.classList.toggle('active',x==='sheet');el.cellMode.classList.toggle('active',x==='cell');render()}function historyButtons(){el.undo.disabled=historyIndex<=0;el.redo.disabled=historyIndex>=history.length-1}function record(){history=history.slice(0,historyIndex+1);history.push(src.getImageData(0,0,sheet.width,sheet.height));if(history.length>50)history.shift();historyIndex=history.length-1;historyButtons()}function restore(i){if(i<0||i>=history.length)return;historyIndex=i;src.putImageData(history[i],0,0);historyButtons();render()}
function render(){if(!ready())return;const b=bounds(),z=scale();canvas.width=b.w*z;canvas.height=b.h*z;ctx.imageSmoothingEnabled=false;ctx.drawImage(sheet,b.x,b.y,b.w,b.h,0,0,canvas.width,canvas.height);if(el.grid.checked&&z>=4){ctx.strokeStyle='rgba(120,150,190,.35)';for(let x=0;x<=b.w;x++){ctx.beginPath();ctx.moveTo(x*z+.5,0);ctx.lineTo(x*z+.5,canvas.height);ctx.stroke()}for(let y=0;y<=b.h;y++){ctx.beginPath();ctx.moveTo(0,y*z+.5);ctx.lineTo(canvas.width,y*z+.5);ctx.stroke()}}el.selection.textContent='画像 '+sheet.width+'×'+sheet.height+'px ／ 選択セル '+cell.col+','+cell.row}function buildCells(){el.cells.replaceChildren();el.cells.style.gridTemplateColumns='repeat('+Math.min(cols(),8)+',1fr)';for(let r=0;r<rows();r++)for(let c=0;c<cols();c++){const b=document.createElement('button');b.textContent=c+','+r;b.classList.toggle('active',c===cell.col&&r===cell.row);b.onclick=()=>{cell={col:c,row:r};buildCells();setMode('cell')};el.cells.append(b)}}function point(e){if(!ready())return null;const r=canvas.getBoundingClientRect(),b=bounds(),x=Math.floor((e.clientX-r.left)*b.w/r.width),y=Math.floor((e.clientY-r.top)*b.h/r.height);return x<0||y<0||x>=b.w||y>=b.h?null:{x:b.x+x,y:b.y+y}}function put(p,c){const d=src.createImageData(1,1);d.data.set(c);src.putImageData(d,p.x,p.y)}function line(a,b,c){let x=a.x,y=a.y,dx=Math.abs(b.x-x),dy=-Math.abs(b.y-y),sx=x<b.x?1:-1,sy=y<b.y?1:-1,e=dx+dy;while(true){put({x,y},c);if(x===b.x&&y===b.y)return;const q=2*e;if(q>=dy){e+=dy;x+=sx}if(q<=dx){e+=dx;y+=sy}}}
function fill(p,c){const b=bounds(),d=src.getImageData(b.x,b.y,b.w,b.h),o=((p.y-b.y)*b.w+p.x-b.x)*4,t=[...d.data.slice(o,o+4)];if(t.every((v,i)=>v===c[i]))return false;const q=[[p.x-b.x,p.y-b.y]];while(q.length){const[x,y]=q.pop();if(x<0||y<0||x>=b.w||y>=b.h)continue;const i=(y*b.w+x)*4;if(!t.every((v,n)=>d.data[i+n]===v))continue;d.data.set(c,i);q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}src.putImageData(d,b.x,b.y);return true}function apply(p,drag){if(tool==='picker'){if(!drag){const d=src.getImageData(p.x,p.y,1,1).data;el.color.value='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');el.alpha.value=d[3];setTool('pencil')}return false}if(tool==='fill')return !drag&&fill(p,color());const c=tool==='eraser'?[0,0,0,0]:color();if(drag&&last)line(last,p,c);else put(p,c);return true}
async function openPng(){if(!window.showOpenFilePicker){say('直接上書き保存に対応していません。Chrome または Edge で開いてください。');return}try{const[next]=await window.showOpenFilePicker({types:[{description:'PNG画像',accept:{'image/png':['.png']}}],excludeAcceptAllOption:true}),file=await next.getFile(),url=URL.createObjectURL(file),image=new Image();say('読み込み中: '+file.name);image.onload=()=>{sheet.width=image.naturalWidth;sheet.height=image.naturalHeight;src.clearRect(0,0,sheet.width,sheet.height);src.drawImage(image,0,0);URL.revokeObjectURL(url);handle=next;cell={col:0,row:0};history=[];historyIndex=-1;record();canvas.hidden=false;el.hint.hidden=true;el.save.disabled=false;buildCells();render();say('読み込み完了: '+file.name)};image.onerror=()=>{URL.revokeObjectURL(url);say('PNGを読み込めません: '+file.name)};image.src=url}catch(e){if(e.name!=='AbortError')say('開けません: '+e.message)}}async function save(){if(!handle)return;try{if(await handle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('書き込み権限が許可されませんでした。');const blob=await new Promise(ok=>sheet.toBlob(ok,'image/png')),w=await handle.createWritable();await w.write(blob);await w.close();say('元のPNGへ上書き保存しました。')}catch(e){say('保存できません: '+e.message)}}
el.open.onclick=openPng;el.save.onclick=save;el.zoom.onchange=render;el.grid.onchange=render;el.sheetMode.onclick=()=>setMode('sheet');el.cellMode.onclick=()=>setMode('cell');el.pencil.onclick=()=>setTool('pencil');el.eraser.onclick=()=>setTool('eraser');el.fill.onclick=()=>setTool('fill');el.picker.onclick=()=>setTool('picker');el.transparent.onclick=()=>{el.alpha.value=0;setTool('pencil')};el.undo.onclick=()=>restore(historyIndex-1);el.redo.onclick=()=>restore(historyIndex+1);canvas.onpointerdown=e=>{const p=point(e);if(!p)return;const did=apply(p,false);last=p;changed=did;drawing=tool==='pencil'||tool==='eraser';if(drawing)canvas.setPointerCapture(e.pointerId);if(did&&!drawing)record();render()};canvas.onpointermove=e=>{const p=point(e);if(!p)return;const d=src.getImageData(p.x,p.y,1,1).data;say('座標 '+p.x+','+p.y+' ／ RGBA('+[d[0],d[1],d[2],d[3]].join(',')+')');if(drawing&&apply(p,true)){last=p;changed=true;render()}};canvas.onpointerup=e=>{if(drawing&&changed)record();drawing=false;last=null;changed=false;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)};document.onkeydown=e=>{if(e.target.matches('input'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();restore(e.shiftKey?historyIndex+1:historyIndex-1);return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();restore(historyIndex+1);return}const n={b:'pencil',e:'eraser',g:'fill',i:'picker'}[e.key.toLowerCase()];if(n)setTool(n)}})();
</script></body></html>
